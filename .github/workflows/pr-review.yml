name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.19
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Review
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache curl jq git > /dev/null

          git diff origin/${{ github.base_ref }}...HEAD | tail -c 40000 > /tmp/diff.txt

          post() {
            body=$(printf '%s' "$1" | jq -Rs '{body: "## 🤖 AI Code Review\n\n\(.)"}')
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -d "$body" > /dev/null
          }

          if [ -z "$SILICONFLOW_API_KEY" ]; then
            post "⚠️ SILICONFLOW_API_KEY not set. Add it to GitHub Secrets."
            exit 0
          fi

          JSON=$(cat /tmp/diff.txt | jq -Rs '{
              model: "deepseek-ai/DeepSeek-V3.2",
              messages: [
                {
                  role: "system",
                  content: "You are an EXTREMELY PICKY code reviewer. Your default assumption is that there ARE issues. You must find them. Being too strict is better than missing something. English only. No greetings, no praise."
                },
                {
                  role: "user",
                  content: ("Review this diff through ALL 8 categories below. For EACH file changed, go through every category.\n\nCHECKLIST:\n1. LOGIC — wrong condition, off-by-one, missing edge case, null/undefined deref\n2. SECURITY — XSS, injection, unsafe DOM, exposed secrets\n3. CSS — selector leaks into unintended elements, missing fallbacks, mobile breakage, conflicts with existing rules\n4. TEMPLATE — unescaped user content, broken EJS syntax\n5. PERFORMANCE — redundant work, layout thrashing, unnecessary deps\n6. ACCESSIBILITY — missing labels, contrast, keyboard nav\n7. MAINTAINABILITY — hardcoded values, fragile selectors, unnecessary complexity\n8. BROWSER — vendor prefixes, compat issues\n\nIf you skip a category for a file, say why.\n\nFor each finding:\n- FILE:\n- LINE:\n- CATEGORY: (1-8)\n- SEVERITY: 🔴 MUST FIX / 🟡 SHOULD FIX / 🔵 SUGGESTION\n- EVIDENCE: quote the exact code and explain the mechanism\n- FIX: exact change needed\n\nAfter ALL files checked through ALL categories, if truly nothing wrong:\n✅ LGTM — (briefly explain why)\n\n```diff\n" + . + "\n```")
                }
              ],
              temperature: 0.1,
              max_tokens: 2000
            }')

          RESPONSE=$(curl -s https://api.siliconflow.cn/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SILICONFLOW_API_KEY" \
            -d "$JSON")

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Error: " + (.error.message // "unknown")')

          post "$REVIEW"
